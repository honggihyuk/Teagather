plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teagather'
version = '0.0.1-SNAPSHOT'
description = 'Teagather - 카페 온라인 스토어'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 추가(security) - 로그인 (관리자 / 고객)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 추가(운영) - 주문 방어 로직 지표 (order.place.*), /actuator/health·metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // 기본은 H2 파일 DB (설치 없이 실행). MySQL 은 mysql 프로필
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // 추가(검증) - MySQL 실DB 검증 (Docker 없으면 자동으로 건너뜀, @Tag("mysql"))
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'mysql'     // 기본 테스트는 빠르게 (H2)
    }
}

// MySQL 실DB 검증 : ./gradlew mysqlTest (Docker 필요)
tasks.register('mysqlTest', Test) {
    description = 'Testcontainers MySQL 로 주문 방어 로직 검증'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql'
    }
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
