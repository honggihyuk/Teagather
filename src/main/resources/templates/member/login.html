<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · Teagather</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-badge-brown-trim.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="ui">
<main class="auth-page">
    <form class="auth-card" th:action="@{/member/login}" method="post">
        <a class="logo" th:href="@{/}"><img th:src="@{/images/logo.png}" alt="Teagather"></a>
        <h1>로그인</h1>
        <div class="banner" th:if="${param.signup}">가입을 마쳤어요. 로그인해 주세요.</div>
        <div class="banner" th:if="${param.logout}">로그아웃했어요.</div>
        <div class="banner red" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않거나 사용이 정지된 계정이에요.</div>
        <div class="banner red" th:if="${param.wrongPage}">관리자 계정은 <a th:href="@{/admin/login}"><b>관리자 로그인</b></a>에서 로그인해 주세요.</div>
        <input type="hidden" name="next" th:value="${param.next}" th:if="${param.next}">
        <div class="field"><label for="username">아이디</label>
            <input class="input" id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">비밀번호</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn primary lg block">로그인</button>
        <div class="links"><a th:href="@{/member/signup}">회원가입</a><a th:href="@{/}">메뉴 둘러보기</a></div>
        <p class="faint small" style="text-align:center">예시 계정 : customer1 ~ customer160 / 1234</p>
    </form>
</main>
</body>
</html>
