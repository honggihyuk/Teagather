<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/shop}">
<head><title>내 정보</title></head>
<body>
<main layout:fragment="content" class="shop-main" style="gap:24px">
    <div class="page-header">
        <div class="row" style="gap:16px">
            <span class="avatar lg" th:text="${me.initials}">민준</span>
            <div><h1 class="page-title" th:text="${me.displayName}">김민준</h1>
                <p class="page-sub"><span class="chip solid" th:text="${me.grade.label}">골드</span> <span th:text="${me.username}">customer1</span></p></div>
        </div>
        <div class="actions"><a class="btn" th:href="@{/orders}">주문 내역</a></div>
    </div>

    <div class="grid grid-3">
        <div class="card kpi"><div class="label">포인트</div><div class="value brown tnum" th:text="|${#numbers.formatInteger(me.point, 1, 'COMMA')}P|">0P</div><div class="foot">결제 금액의 1%가 쌓여요</div></div>
        <div class="card kpi"><div class="label">주문</div><div class="value tnum"><th:block th:text="${me.orderCount}">0</th:block><small>번</small></div></div>
        <div class="card kpi"><div class="label">누적 결제</div><div class="value tnum" th:text="|${#numbers.formatInteger(me.totalSpent, 1, 'COMMA')}원|">0원</div></div>
    </div>

    <section th:if="${!recommended.isEmpty()}">
        <div class="section-head"><div><h2>추천 메뉴</h2><p>주문 기록을 학습한 추천 모델이 골랐어요</p></div></div>
        <div class="menu-grid"><th:block th:each="c : ${recommended}"><a th:replace="~{fragments/ui :: menuCard(${c})}"></a></th:block></div>
    </section>

    <section class="card">
        <div class="card-head"><h2>최근 주문</h2><a class="more" th:href="@{/orders}">전체 보기 ›</a></div>
        <div class="cart-line" th:each="o : ${recentOrders}" style="grid-template-columns:minmax(0,1fr) auto auto">
            <a th:href="@{/orders/{id}(id=${o.id})}"><b th:text="${o.summary}">아메리카노</b>
                <div class="muted small" th:text="${#temporals.format(o.orderedAt, 'yyyy.M.d HH:mm')}">시각</div></a>
            <b class="tnum" th:text="|${#numbers.formatInteger(o.payAmount, 1, 'COMMA')}원|">0원</b>
            <span th:replace="~{fragments/ui :: chip(${o.status.chip}, ${o.status.label})}"></span>
        </div>
        <div class="empty" th:if="${recentOrders.isEmpty()}">아직 주문이 없어요.</div>
    </section>
</main>
</body>
</html>
