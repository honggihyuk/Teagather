<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/shop}">
<head><title>주문 상세</title></head>
<body>
<main layout:fragment="content" class="shop-main" style="gap:24px">
    <div class="page-header">
        <div><div class="eyebrow" th:text="|주문번호 ${order.orderNo}|">주문번호</div>
            <h1 class="page-title" th:text="${done} ? '주문을 받았어요' : '주문 상세'">주문 상세</h1>
            <p class="page-sub" th:text="|${#temporals.format(order.orderedAt, 'yyyy.M.d HH:mm')} · ${order.pickupType.label}|">시각</p></div>
        <div class="actions">
            <form th:if="${order.status.name() == 'PLACED'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" class="inline">
                <button type="submit" class="btn danger" data-confirm="이 주문을 취소할까요?" data-confirm-body="매장에서 준비를 시작하기 전까지만 취소할 수 있어요." data-confirm-ok="주문 취소" data-danger>주문 취소</button>
            </form>
            <a class="btn" th:href="@{/orders}">주문 내역</a>
        </div>
    </div>

    <section class="card">
        <div class="card-head"><h2>진행 상황</h2><span th:replace="~{fragments/ui :: chip(${order.status.chip}, ${order.status.label})}"></span></div>
        <div class="steps" th:if="${order.status.name() != 'CANCELED'}" role="progressbar" aria-valuemin="1" aria-valuemax="4" th:attr="aria-valuenow=${order.status.step}">
            <div class="s" th:each="s : ${steps}" th:classappend="${s.step <= order.status.step} ? 'on'"><i></i><span th:text="${s.label}">접수</span></div>
        </div>
        <div class="banner red" th:if="${order.status.name() == 'CANCELED'}">취소된 주문이에요.</div>
    </section>

    <div class="split">
        <section class="card">
            <div class="card-head"><h2>주문 메뉴</h2></div>
            <div class="cart-line" th:each="i : ${order.items}" style="grid-template-columns:minmax(0,1fr) auto">
                <div><b th:text="|${i.productName} × ${i.quantity}|">아메리카노</b>
                    <div class="muted small" th:text="${i.optionText == null or i.optionText.isEmpty()} ? '기본' : ${i.optionText}">ICE</div></div>
                <b class="tnum" th:text="|${#numbers.formatInteger(i.lineAmount, 1, 'COMMA')}원|">4,000원</b>
            </div>
            <p class="muted" style="margin-top:12px" th:if="${order.request}" th:text="|요청사항 : ${order.request}|">요청</p>
        </section>
        <aside class="card">
            <div class="card-head"><h2>결제 금액</h2></div>
            <div class="sum-row"><span>메뉴 금액</span><span class="tnum" th:text="|${#numbers.formatInteger(order.totalAmount, 1, 'COMMA')}원|">0원</span></div>
            <div class="sum-row"><span>할인</span><span class="tnum" th:text="|-${#numbers.formatInteger(order.discountAmount, 1, 'COMMA')}원|">0원</span></div>
            <div class="sum-row"><span>적립 포인트</span><span class="tnum" th:text="|${order.earnedPoint}P|">0P</span></div>
            <div class="sum-row total"><span>결제 금액</span><span class="v tnum" th:text="|${#numbers.formatInteger(order.payAmount, 1, 'COMMA')}원|">0원</span></div>
            <p class="muted small" style="margin-top:10px">결제는 매장에서 해요.</p>
        </aside>
    </div>
</main>
</body>
</html>
