<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/shop}">
<head><title>홈</title></head>
<body>
<main layout:fragment="content" class="shop-main">

    <section class="shop-hero">
        <div>
            <div class="eyebrow">차와 사람이 모이는 곳</div>
            <h1>오늘 마실 한 잔,<br>Teagather 에서 미리 주문하세요</h1>
            <p>매장에서 바로 받거나 포장해 가세요. 오늘의 메뉴와 할인 메뉴는 매일 아침 바뀌어요.</p>
            <div class="actions">
                <a class="btn primary lg" th:href="@{/menu}">메뉴 보러 가기</a>
                <a class="btn lg" th:href="@{/orders}" th:if="${loginMember != null}">주문 내역</a>
            </div>
        </div>
        <img class="hero-logo" th:src="@{/images/logo-badge.png}" alt="Teagather British Teahouse">
    </section>

    <nav class="cat-chips" aria-label="카테고리 바로가기">
        <a th:each="cat : ${categories}" th:href="@{/menu(category=${cat.id})}" th:text="${cat.name}">커피</a>
    </nav>

    <section th:if="${!todayMenus.isEmpty()}" aria-labelledby="sec-today">
        <div class="section-head">
            <div><h2 id="sec-today">오늘의 메뉴</h2><p>오늘 가장 많이 찾을 것으로 예상되는 메뉴예요</p></div>
        </div>
        <div class="menu-grid">
            <th:block th:each="c : ${todayMenus}"><a th:replace="~{fragments/ui :: menuCard(${c})}"></a></th:block>
        </div>
    </section>

    <section th:if="${!discountMenus.isEmpty()}" aria-labelledby="sec-discount">
        <div class="section-head">
            <div><h2 id="sec-discount">오늘의 할인</h2><p>오늘만, 혹은 며칠 동안만 할인해요</p></div>
        </div>
        <div class="menu-grid">
            <th:block th:each="c : ${discountMenus}"><a th:replace="~{fragments/ui :: menuCard(${c})}"></a></th:block>
        </div>
    </section>

    <section th:if="${!newMenus.isEmpty()}" aria-labelledby="sec-new">
        <div class="section-head">
            <div><h2 id="sec-new">신메뉴</h2><p>새로 나온 메뉴를 먼저 만나 보세요</p></div>
        </div>
        <div class="menu-grid">
            <th:block th:each="c : ${newMenus}"><a th:replace="~{fragments/ui :: menuCard(${c})}"></a></th:block>
        </div>
    </section>

    <section th:if="${!recommended.isEmpty()}" aria-labelledby="sec-reco">
        <div class="section-head">
            <div><h2 id="sec-reco" th:text="${recommendTitle}">추천 메뉴</h2><p th:text="${recommendSub}">설명</p></div>
            <a class="more" th:href="@{/menu}">전체 메뉴 ›</a>
        </div>
        <div class="menu-grid">
            <th:block th:each="c : ${recommended}"><a th:replace="~{fragments/ui :: menuCard(${c})}"></a></th:block>
        </div>
        <p class="muted small" style="margin-top:14px" th:if="${loginMember == null}">
            <a class="brown" th:href="@{/member/login}">로그인</a>하면 내 주문 기록으로 고른 추천 메뉴를 볼 수 있어요.</p>
    </section>
</main>
</body>
</html>
