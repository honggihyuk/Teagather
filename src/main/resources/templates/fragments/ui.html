<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 아이콘 (선 아이콘, currentColor) -->
<th:block th:fragment="icon(name)" th:switch="${name}">
    <svg th:case="'grid'" class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    <svg th:case="'receipt'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
    <svg th:case="'users'" class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 4 1.8 4.5 4.5"/></svg>
    <svg th:case="'pie'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
    <svg th:case="'sparkle'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
    <svg th:case="'box'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg>
    <svg th:case="'layers'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    <svg th:case="'sliders'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    <svg th:case="'percent'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>
    <svg th:case="'bar'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <svg th:case="'logout'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
    <svg th:case="'cart'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
    <svg th:case="'user'" class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 4.2-6.5 8-6.5s7 2.1 8 6.5"/></svg>
    <svg th:case="'store'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10"/><path d="M3 10l2-6h14l2 6c0 1.7-1.3 3-3 3s-3-1.3-3-3c0 1.7-1.3 3-3 3s-3-1.3-3-3c0 1.7-1.3 3-3 3s-3-1.3-3-3z"/><path d="M10 20v-5h4v5"/></svg>
    <svg th:case="'refresh'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.6L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.6L20 16"/><path d="M20 21v-5h-5"/></svg>
    <svg th:case="'download'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>
    <svg th:case="'plus'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <!-- 메뉴 타일 -->
    <svg th:case="'cup'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg>
    <svg th:case="'tea'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h12v3a6 6 0 0 1-12 0z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M12 3c3 1 4 3.5 3 6-3-.5-4.5-3-3-6z"/><path d="M3 21h16"/></svg>
    <svg th:case="'latte'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l-1.5 18h-9z"/><path d="M6.6 9h10.8"/><path d="M10 13c1 1 3 1 4 0"/></svg>
    <svg th:case="'ade'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1.5 14h-9z"/><path d="M14 2l-2 9"/><circle cx="16.5" cy="7" r="3"/></svg>
    <svg th:case="'cake'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16v-7H4z"/><path d="M4 16c2 1.2 4 1.2 5.3 0 1.4 1.2 4 1.2 5.4 0 1.3 1.2 3.3 1.2 5.3 0"/><path d="M12 13V9"/><path d="M12 4c1 1 1 2.2 0 3-1-.8-1-2 0-3z"/></svg>
    <svg th:case="'bread'" class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a7 5 0 0 1 14 0v8H5z"/><path d="M9 11v3M12 10v4M15 11v3"/></svg>
    <svg th:case="*" class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
</th:block>

<!-- 상태 칩 : cls = solid / cream / grey / red / outline -->
<span th:fragment="chip(cls, label)" class="chip" th:classappend="${cls}" th:text="${label}">상태</span>

<!-- 메뉴 이미지 타일 (카테고리 색 + 아이콘) -->
<div th:fragment="tile(category, size)" class="tile" th:classappend="|tone-${category.toneOrDefault} ${size}|">
    <th:block th:replace="~{fragments/ui :: icon(${category.iconOrDefault})}"/>
</div>

<!-- 가격 (할인 시 할인가 + 원래 가격) : c = ProductCard -->
<span th:fragment="price(c)" class="price">
    <th:block th:if="${c.discounted}"><span class="sale" th:text="|${#numbers.formatInteger(c.salePrice, 1, 'COMMA')}원|">4,250원</span><span class="orig" th:text="|${#numbers.formatInteger(c.price, 1, 'COMMA')}원|">5,000원</span></th:block>
    <span th:unless="${c.discounted}" th:text="|${#numbers.formatInteger(c.price, 1, 'COMMA')}원|">5,000원</span>
</span>

<!-- 메뉴 카드 : c = ProductCard -->
<a th:fragment="menuCard(c)" class="menu-card" th:href="@{/menu/{id}(id=${c.product.id})}"
   th:classappend="${c.product.status.name() == 'SOLD_OUT'} ? 'soldout'">
    <div class="tile" th:classappend="|tone-${c.product.category.toneOrDefault}|">
        <th:block th:replace="~{fragments/ui :: icon(${c.product.category.iconOrDefault})}"/>
        <div class="badges">
            <span class="chip solid" th:if="${c.product.todayMenu}">오늘의 메뉴</span>
            <span class="chip dark" th:if="${c.product.fresh}">NEW</span>
            <span class="chip red" th:if="${c.discounted}" th:text="${c.discountBadge}">-15%</span>
            <span class="chip grey" th:if="${c.product.status.name() == 'SOLD_OUT'}">품절</span>
        </div>
    </div>
    <div>
        <div class="name" th:text="${c.product.name}">아메리카노</div>
        <div th:replace="~{fragments/ui :: price(${c})}"></div>
        <div class="reason" th:if="${c.reason}" th:text="${c.reason}">추천 이유</div>
    </div>
</a>

<!-- 원 단위 숫자 -->
<th:block th:fragment="won(v)" th:text="|${#numbers.formatInteger(v, 1, 'COMMA')}원|">0원</th:block>

</body>
</html>
