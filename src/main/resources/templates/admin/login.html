<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 · Teagather</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-badge-brown-trim.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="ui">
<main class="auth-page">
    <form class="auth-card" th:action="@{/admin/login}" method="post">
        <div class="logo"><img th:src="@{/images/logo.png}" alt="Teagather"></div>
        <h1>관리자 로그인</h1>
        <div class="banner" th:if="${param.logout}">로그아웃했어요.</div>
        <div class="banner red" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않아요.</div>
        <div class="banner red" th:if="${param.denied}">관리자만 들어올 수 있어요.</div>
        <div class="banner red" th:if="${param.wrongPage}">고객 계정은 <a th:href="@{/member/login}"><b>고객 로그인</b></a>에서 로그인해 주세요.</div>
        <div class="field"><label for="username">관리자 아이디</label>
            <input class="input" id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">비밀번호</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn primary lg block">로그인</button>
        <div class="links"><a th:href="@{/member/login}">고객 로그인</a><a th:href="@{/}">고객 사이트</a></div>
    </form>
</main>
</body>
</html>
