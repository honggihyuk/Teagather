####################################
# 테스트 전용 : 메모리 H2 (파일 DB data/teagather 를 건드리지 않는다)
#  - 예시 데이터 끔 (테스트가 필요한 만큼 직접 만든다)
#  - 서버 시작 분석 끔
####################################
spring:
  datasource:
    url: jdbc:h2:mem:teagather-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: create-drop
  devtools:
    restart:
      enabled: false

app:
  seed:
    enabled: false
  analysis:
    run-on-startup: false
    cron: "-"
